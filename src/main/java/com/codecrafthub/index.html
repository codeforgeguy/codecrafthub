<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeCraftHub: Your Learning Management Platform</title>
  <style>
    :root {
      --primary: #8B5CF6;
      --success: #F59E0B;
      --delete: #EF4444;
      --bg: #F3F4F6;
      --card-bg: #FFFFFF;
      --text: #1F2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding: 24px;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 24px;
      text-align: center;
    }

    header h1 {
      color: var(--primary);
      font-size: 28px;
    }

    .card {
      background: var(--card-bg);
      padding: 24px;
      border-radius: 8px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      margin-bottom: 24px;
    }

    h2 {
      margin-bottom: 16px;
      font-size: 20px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    label {
      display: block;
      margin-bottom: 4px;
      font-weight: 600;
      font-size: 14px;
    }

    input, textarea, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #D1D5DB;
      border-radius: 6px;
      font-size: 14px;
    }

    button {
      padding: 10px 18px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      color: #fff;
    }

    .btn-primary { background-color: var(--primary); }
    .btn-edit { background-color: var(--success); }
    .btn-delete { background-color: var(--delete); }

    .alert {
      padding: 12px;
      border-radius: 6px;
      margin-bottom: 16px;
      display: none;
    }

    .alert-error { background-color: #FEE2E2; color: #991B1B; }
    .alert-success { background-color: #FEF3C7; color: #92400E; }

    .loading-spinner {
      display: none;
      text-align: center;
      margin: 16px 0;
      color: var(--primary);
      font-weight: bold;
    }

    .course-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 12px;
    }

    .course-table th, .course-table td {
      border: 1px solid #E5E7EB;
      padding: 12px;
      text-align: left;
    }

    .course-table th {
      background-color: #F9FAFB;
    }

    /* Modal for Editing */
    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
    }

    .modal-content {
      background: #fff;
      padding: 24px;
      border-radius: 8px;
      max-width: 500px;
      width: 90%;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>CodeCraftHub: Your Learning Management Platform</h1>
    </header>

    <div id="alertBox" class="alert"></div>
    <div id="loading" class="loading-spinner">Loading...</div>

    <!-- Add Course Form -->
    <div class="card">
      <h2>Add New Course</h2>
      <form id="addCourseForm">
        <div class="form-group">
          <label for="name">Course Name *</label>
          <input type="text" id="name" required />
        </div>
        <div class="form-group">
          <label for="description">Description *</label>
          <textarea id="description" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label for="target_date">Target Date (YYYY-MM-DD) *</label>
          <input type="date" id="target_date" required />
        </div>
        <div class="form-group">
          <label for="status">Status *</label>
          <select id="status" required>
            <option value="Not Started">Not Started</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <button type="submit" class="btn-primary">Add Course</button>
      </form>
    </div>

    <!-- Course List -->
    <div class="card">
      <h2>All Courses</h2>
      <div style="overflow-x: auto;">
        <table class="course-table">
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Description</th>
              <th>Target Date</th>
              <th>Status</th>
              <th>Created At</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="courseTableBody"></tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Edit Modal -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <h2>Edit Course</h2>
      <form id="editCourseForm">
        <input type="hidden" id="editId" />
        <div class="form-group">
          <label>Course Name</label>
          <input type="text" id="editName" required />
        </div>
        <div class="form-group">
          <label>Description</label>
          <textarea id="editDescription" rows="3" required></textarea>
        </div>
        <div class="form-group">
          <label>Target Date</label>
          <input type="date" id="editTargetDate" required />
        </div>
        <div class="form-group">
          <label>Status</label>
          <select id="editStatus">
            <option value="Not Started">Not Started</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <div style="display: flex; gap: 8px; margin-top: 16px;">
          <button type="submit" class="btn-edit">Save Changes</button>
          <button type="button" onclick="closeEditModal()" style="background:#6B7280;">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:8080/api/courses';

    function showMessage(text, isError = false) {
      const alert = document.getElementById('alertBox');
      alert.textContent = text;
      alert.className = `alert ${isError ? 'alert-error' : 'alert-success'}`;
      alert.style.display = 'block';
      setTimeout(() => alert.style.display = 'none', 4000);
    }

    function toggleLoading(show) {
      document.getElementById('loading').style.display = show ? 'block' : 'none';
    }

    async function fetchCourses() {
      toggleLoading(true);
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error('Failed to fetch courses');
        const courses = await res.json();
        renderTable(courses);
      } catch (err) {
        showMessage(err.message, true);
      } finally {
        toggleLoading(false);
      }
    }

    function renderTable(courses) {
      const tbody = document.getElementById('courseTableBody');
      tbody.innerHTML = '';
      courses.forEach(c => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${c.id}</td>
          <td><strong>${c.name}</strong></td>
          <td>${c.description}</td>
          <td>${c.target_date || ''}</td>
          <td>${c.status}</td>
          <td>${c.created_at ? new Date(c.created_at).toLocaleDateString() : ''}</td>
          <td>
            <div style="display:flex; gap:6px;">
              <button class="btn-edit" onclick='openEditModal(${JSON.stringify(c)})'>Edit</button>
              <button class="btn-delete" onclick="deleteCourse(${c.id})">Remove</button>
            </div>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    document.getElementById('addCourseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = {
        name: document.getElementById('name').value,
        description: document.getElementById('description').value,
        target_date: document.getElementById('target_date').value,
        status: document.getElementById('status').value
      };

      toggleLoading(true);
      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('Failed to create course');
        document.getElementById('addCourseForm').reset();
        showMessage('Course created successfully!');
        fetchCourses();
      } catch (err) {
        showMessage(err.message, true);
      } finally {
        toggleLoading(false);
      }
    });

    function openEditModal(course) {
      document.getElementById('editId').value = course.id;
      document.getElementById('editName').value = course.name;
      document.getElementById('editDescription').value = course.description;
      document.getElementById('editTargetDate').value = course.target_date;
      document.getElementById('editStatus').value = course.status;
      document.getElementById('editModal').style.display = 'flex';
    }

    function closeEditModal() {
      document.getElementById('editModal').style.display = 'none';
    }

    document.getElementById('editCourseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const id = document.getElementById('editId').value;
      const body = {
        name: document.getElementById('editName').value,
        description: document.getElementById('editDescription').value,
        target_date: document.getElementById('editTargetDate').value,
        status: document.getElementById('editStatus').value
      };

      toggleLoading(true);
      try {
        const res = await fetch(`${API_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        if (!res.ok) throw new Error('Failed to update course');
        closeEditModal();
        showMessage('Course updated successfully!');
        fetchCourses();
      } catch (err) {
        showMessage(err.message, true);
      } finally {
        toggleLoading(false);
      }
    });

    async function deleteCourse(id) {
      if (!confirm('Are you sure you want to remove this course?')) return;
      toggleLoading(true);
      try {
        const res = await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed to delete course');
        showMessage('Course removed successfully!');
        fetchCourses();
      } catch (err) {
        showMessage(err.message, true);
      } finally {
        toggleLoading(false);
      }
    }

    fetchCourses();
  </script>
</body>
</html>
