<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CodeCraftHub - Learning Platform</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen p-6 font-sans">
  <div class="max-w-5xl mx-auto">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-gray-800">CodeCraftHub</h1>
      <p class="text-gray-600">Personalized Learning Platform Dashboard</p>
    </header>

    <!-- Create Course Form -->
    <div class="bg-white p-6 rounded-lg shadow-md mb-8">
      <h2 class="text-xl font-semibold mb-4 text-gray-700">Add New Course</h2>
      <form id="courseForm" class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Course Name</label>
          <input type="text" id="name" required class="w-full border rounded px-3 py-2 border-gray-300 focus:outline-blue-500" placeholder="e.g. Master Spring Boot" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Target Date</label>
          <input type="date" id="targetDate" required class="w-full border rounded px-3 py-2 border-gray-300 focus:outline-blue-500" />
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-700 mb-1">Description</label>
          <textarea id="description" required rows="2" class="w-full border rounded px-3 py-2 border-gray-300 focus:outline-blue-500" placeholder="Course goals and syllabus..."></textarea>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Status</label>
          <select id="status" class="w-full border rounded px-3 py-2 border-gray-300 focus:outline-blue-500">
            <option value="Not Started">Not Started</option>
            <option value="In Progress">In Progress</option>
            <option value="Completed">Completed</option>
          </select>
        </div>
        <div class="flex items-end">
          <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded transition">Add Course</button>
        </div>
      </form>
    </div>

    <!-- Course List -->
    <div>
      <h2 class="text-xl font-semibold mb-4 text-gray-700">Your Courses</h2>
      <div id="courseList" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
      <p id="emptyState" class="text-gray-500 text-center py-8 hidden">No courses found. Add your first course above!</p>
    </div>
  </div>

  <script>
    const API_URL = 'http://localhost:8080/api/courses';

    async function fetchCourses() {
      try {
        const res = await fetch(API_URL);
        const courses = await res.json();
        renderCourses(courses);
      } catch (err) {
        console.error('Error fetching courses:', err);
      }
    }

    function renderCourses(courses) {
      const container = document.getElementById('courseList');
      const emptyState = document.getElementById('emptyState');
      container.innerHTML = '';

      if (!courses || courses.length === 0) {
        emptyState.classList.remove('hidden');
        return;
      }
      emptyState.classList.add('hidden');

      courses.forEach(course => {
        const card = document.createElement('div');
        card.className = 'bg-white p-5 rounded-lg shadow-sm border border-gray-200 flex flex-col justify-between';
        card.innerHTML = `
          <div>
            <div class="flex justify-between items-start mb-2">
              <h3 class="font-bold text-lg text-gray-800">${course.name}</h3>
              <span class="text-xs font-semibold px-2 py-1 rounded ${
                course.status === 'Completed' ? 'bg-green-100 text-green-700' :
                course.status === 'In Progress' ? 'bg-yellow-100 text-yellow-700' : 'bg-gray-100 text-gray-600'
              }">${course.status}</span>
            </div>
            <p class="text-sm text-gray-600 mb-4">${course.description}</p>
            <div class="text-xs text-gray-500 mb-4">
              <p>Target: <span class="font-medium">${course.target_date || 'N/A'}</span></p>
              <p>Created: <span class="font-medium">${course.created_at ? new Date(course.created_at).toLocaleDateString() : 'N/A'}</span></p>
            </div>
          </div>
          <div class="pt-4 border-t border-gray-100 flex items-center justify-between gap-2">
            <select onchange="updateStatus(${course.id}, this.value)" class="text-xs border rounded p-1 border-gray-300">
              <option value="Not Started" ${course.status === 'Not Started' ? 'selected' : ''}>Not Started</option>
              <option value="In Progress" ${course.status === 'In Progress' ? 'selected' : ''}>In Progress</option>
              <option value="Completed" ${course.status === 'Completed' ? 'selected' : ''}>Completed</option>
            </select>
            <button onclick="deleteCourse(${course.id})" class="text-xs bg-red-50 hover:bg-red-100 text-red-600 font-semibold py-1 px-3 rounded">Delete</button>
          </div>
        `;
        container.appendChild(card);
      });
    }

    document.getElementById('courseForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const newCourse = {
        name: document.getElementById('name').value,
        description: document.getElementById('description').value,
        target_date: document.getElementById('targetDate').value,
        status: document.getElementById('status').value
      };

      try {
        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(newCourse)
        });
        if (res.ok) {
          document.getElementById('courseForm').reset();
          fetchCourses();
        }
      } catch (err) {
        alert('Failed to connect to backend server');
      }
    });

    async function updateStatus(id, newStatus) {
      try {
        await fetch(`${API_URL}/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ status: newStatus })
        });
        fetchCourses();
      } catch (err) {
        alert('Failed to update status');
      }
    }

    async function deleteCourse(id) {
      if (!confirm('Are you sure you want to delete this course?')) return;
      try {
        await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
        fetchCourses();
      } catch (err) {
        alert('Failed to delete course');
      }
    }

    fetchCourses();
  </script>
</body>
</html>
